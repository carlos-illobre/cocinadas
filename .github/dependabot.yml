# Avisos de dependencias con vulnerabilidades y actualizaciones.
#
# Sin esto nadie se entera de un CVE en una dependencia hasta que lo cuenta alguien.
# Semanal y agrupado para que no sea una lluvia de pull requests: lo que importa es que
# el aviso llegue, no que llegue una vez por paquete.
version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las de desarrollo van todas juntas: no llegan al sitio publicado.
      desarrollo:
        dependency-type: development
      produccion:
        dependency-type: production

  # No hay entrada `docker`: el proyecto dejó de tener Dockerfiles (ADR-017).

  # Las acciones del CI, que corren con acceso al repositorio. Agrupadas para que una
  # tanda de versiones nuevas sea un pull request y no cinco.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      acciones:
        patterns:
          - '*'
