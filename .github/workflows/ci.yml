# Pipeline (docs/TESTING.md):
#   pruebas          en cada push y PR: unitarias con la compuerta del 100 %.
#   vulnerabilidades en cada push y PR: CVE y secretos filtrados. Informa, no reprueba.
#   publicar         solo en main y solo si las pruebas pasaron: compila la app y la
#                    publica en GitHub Pages. Cada merge a main es un push a main, así
#                    que cada merge se publica solo.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_PNPM: 10.34.5
  VERSION_NODE: 22

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.VERSION_PNPM }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.VERSION_NODE }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Unitarias con compuerta de cobertura
        run: bash tests/utest.sh
      - name: El catálogo del repositorio es válido
        run: python3 data/recetas/validar-receta.py
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: web/coverage/
          retention-days: 7

  vulnerabilidades:
    # Busca CVE en las dependencias y secretos filtrados en el repositorio. No reprueba
    # el build: avisa. El día que una dependencia tenga un fallo grave, el aviso llega
    # acá y no cuando alguien lo explota.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Trivy sobre el repositorio
        # OJO con el prefijo `v`: los tags de esta acción son `v0.36.0`, no `0.36.0`.
        # Sin él GitHub no resuelve la acción y el job falla a los dos segundos con
        # «Unable to resolve action», sin llegar a escanear nada. Estuvo así desde que
        # se escribió el pipeline: Trivy nunca había corrido.
        uses: aquasecurity/trivy-action@v0.36.0
        # `continue-on-error` también en el paso, y no solo en el job: sin esto, cuando
        # Trivy no puede bajar su base de datos, el PR queda con una cruz roja aunque el
        # job no bloquee. Una comprobación que avisa y siempre se ve en rojo enseña a
        # ignorar las comprobaciones, que es peor que no tenerla. Los hallazgos se leen
        # en el log del job.
        continue-on-error: true
        env:
          # La base de vulnerabilidades se baja de ghcr.io, que limita las descargas
          # anónimas y a veces contesta TOOMANYREQUESTS. Estos son los espejos que
          # publica el propio proyecto para ese caso.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

  publicar:
    # Solo en main y solo si las pruebas pasaron. Todo merge a main —con commit de merge
    # o con squash— es un push a main, así que esto corre en cada merge, sin apretar nada.
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # Para el token OIDC con el que deploy-pages se autentica; sin esto falla.
      id-token: write
    # Una publicación por vez, y sin cancelar la que esté en curso: cortarla a mitad
    # puede dejar el sitio a medias.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.VERSION_PNPM }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.VERSION_NODE }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/configure-pages@v5
      - name: Instalar y compilar
        # `pnpm build` genera antes el catálogo desde data/ (ADR-006): el sitio publicado
        # trae las recetas del mismo commit.
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Que el build no haya emitido rutas absolutas
        # Pages sirve el sitio en /<repo>/, no en la raíz. Una ruta que empiece con `/`
        # apuntaría al dominio y daría 404 solo en producción, que es el peor momento
        # para enterarse. `base: './'` en vite.config.ts es lo que lo evita.
        run: |
          if grep -oE '(src|href)="/[^/][^"]*"' web/dist/index.html; then
            echo "::error::el index.html tiene rutas absolutas: no van a resolver bajo /<repo>/"
            exit 1
          fi
          echo "sin rutas absolutas en el index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: publicar
        uses: actions/deploy-pages@v4
