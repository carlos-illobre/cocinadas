# Único compose del proyecto (ADR-001). Todo lo que cambia entre ambientes sale del .env;
# lo que no cambia va literal acá. Una variable ausente corta el arranque (`:?`) en vez de
# caer en un valor por omisión: fallar al arrancar es el único momento en que el error de
# configuración todavía es barato.
#
# Levantar en local:   docker compose up -d --build
# Producción:          deployment/oracle-single/deploy.py (trae las imágenes por SHA)

name: cocinadas

# Rotación del log de TODOS los contenedores. El driver json-file no tiene límite por
# omisión: lo que un servicio escriba se guarda para siempre, y con el disco lleno se cae
# todo el stack sin que nada lo haya atacado. Es la forma más silenciosa de tirar abajo
# una VM chica.
#
# El techo por contenedor es max-size × max-file: con 512k × 2 son 1 MB por contenedor.
# Va como ancla y no en /etc/docker/daemon.json porque los valores dependen del ambiente y
# la fuente de la verdad es el .env (ADR-001).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:?falta LOG_MAX_SIZE en el .env}
    max-file: "${LOG_MAX_FILES:?falta LOG_MAX_FILES en el .env}"

# Lo que no necesita ningún contenedor de esta aplicación: escalar privilegios y las
# capacidades de root. Un fallo en una dependencia no alcanza para salir del contenedor.
x-endurecido: &endurecido
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  web:
    # La aplicación: Caddy sirviendo el bundle (la SPA con el catálogo adentro). Es un
    # inquilino (ADR-016): habla HTTP, no termina TLS y no sabe por qué dominio lo
    # llamaron. Sin volúmenes, porque no guarda nada.
    image: ${REGISTRO:?falta REGISTRO en el .env}/cocinadas-web:${TAG:?falta TAG en el .env}
    build:
      # Contexto en la raíz porque el build genera el catálogo leyendo data/ (ADR-006).
      # Lo que entra lo limita el .dockerignore de la raíz.
      context: .
      dockerfile: microservices/frontend/Dockerfile
    <<: *endurecido
    # El binario de Caddy trae NET_BIND_SERVICE como capacidad de archivo. Si no está en
    # el conjunto del contenedor, el exec falla con «operation not permitted» aunque el
    # puerto sea alto.
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_APP:?falta MEM_LIMIT_APP en el .env}
    cpus: ${CPU_LIMIT_APP:?falta CPU_LIMIT_APP en el .env}
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    environment:
      # DEBUG | INFO | WARN | ERROR: el nivel del log de Caddy.
      LOG_LEVEL: ${LOG_LEVEL:?falta LOG_LEVEL en el .env}
    ports:
      # Publicado aunque el proxy lo alcance por la red interna: es lo que deja pegarle
      # directo en desarrollo, y lo que hace que la aplicación siga sirviendo si el proxy
      # de acá está apagado porque adelante hay otra cosa (ADR-016).
      #
      # APP_ADDR es 0.0.0.0 y lo que lo mantiene fuera de internet es la Security List de
      # la VCN, donde este puerto no se abre: los puertos que publica Docker no pasan por
      # la cadena INPUT de iptables, así que ufw no los protege.
      - "${APP_ADDR:?falta APP_ADDR en el .env}:${PUERTO_APP:?falta PUERTO_APP en el .env}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/salud"]
      interval: 15s
      timeout: 5s
      retries: 5

  proxy:
    # El reverse proxy de la MÁQUINA, no de esta aplicación (ADR-016): ata el 80 y el 443,
    # emite y renueva el TLS, y reparte por dominio entre esta app y las demás que haya.
    #
    # OPTATIVO: solo existe si COMPOSE_PROFILES incluye `proxy`. En un ambiente donde el
    # TLS lo termine otra cosa —un balanceador de la nube, o el proxy de otra aplicación
    # que ya tenga el 80— se deja apagado y no se levanta nada.
    profiles: ["proxy"]
    image: caddy:2-alpine
    <<: *endurecido
    # El 80 y el 443 son privilegiados: es la única capacidad que se le devuelve después
    # de sacarle todas.
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_PROXY:?falta MEM_LIMIT_PROXY en el .env}
    cpus: ${CPU_LIMIT_PROXY:?falta CPU_LIMIT_PROXY en el .env}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # `http://localhost` en desarrollo (sin TLS); el dominio a secas en producción, y
      # Caddy pide el certificado a Let's Encrypt solo.
      SITE_ADDRESS: ${SITE_ADDRESS:?falta SITE_ADDRESS en el .env}
      LOG_LEVEL: ${LOG_LEVEL:?falta LOG_LEVEL en el .env}
    # Para que los vecinos de la máquina se alcancen por el puerto que publican en el
    # host: adentro del contenedor, 127.0.0.1 es el propio contenedor y no la VM.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # PROXY_ADDR es 0.0.0.0 cuando Cocinadas es la única aplicación que atiende de
      # afuera, y 127.0.0.1 cuando otro proxy de la misma máquina le pasa el tráfico
      # (deployment/oracle-single/README.md). Adentro, Caddy escucha 80 y 443 siempre.
      - "${PROXY_ADDR:?falta PROXY_ADDR en el .env}:${PUERTO_HTTP:?falta PUERTO_HTTP en el .env}:80"
      - "${PROXY_ADDR:?falta PROXY_ADDR en el .env}:${PUERTO_HTTPS:?falta PUERTO_HTTPS en el .env}:443"
      - "${PROXY_ADDR:?falta PROXY_ADDR en el .env}:${PUERTO_HTTPS:?falta PUERTO_HTTPS en el .env}:443/udp"
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/proxy/vecinos:/etc/caddy/vecinos:ro
      - caddy-datos:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/salud"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  # Los dos son del proxy, y ninguno guarda datos de la aplicación: las cocinadas viven en
  # el celular de quien cocina y el catálogo viaja dentro de la imagen. En el servidor no
  # hay nada que respaldar (ADR-015). Con el proxy apagado no se usa ninguno.
  caddy-datos: {}      # certificados TLS; perderlo obliga a reemitir
  caddy-config: {}     # configuración derivada de Caddy; se regenera al arrancar
