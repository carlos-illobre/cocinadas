# Único compose del proyecto (ADR-001). Todo lo que cambia entre ambientes sale del .env;
# lo que no cambia va literal acá. Una variable ausente corta el arranque (`:?`) en vez de
# caer en un valor por omisión: fallar al arrancar es el único momento en que el error de
# configuración todavía es barato.
#
# Levantar en local:   docker compose up -d --build
# Producción:          deployment/oracle-single/deploy.sh (trae las imágenes por SHA)

name: templa

# Rotación del log de TODOS los contenedores. El driver json-file no tiene límite por
# omisión: lo que un servicio escriba se guarda para siempre, y con el disco lleno se cae
# todo el stack sin que nada lo haya atacado. Es la forma más silenciosa de tirar abajo
# una VM chica.
#
# El techo por contenedor es max-size × max-file: con 512k × 2 son 1 MB por contenedor.
# Va como ancla y no en /etc/docker/daemon.json porque los valores dependen del ambiente y
# la fuente de la verdad es el .env (ADR-001).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:?falta LOG_MAX_SIZE en el .env}
    max-file: "${LOG_MAX_FILES:?falta LOG_MAX_FILES en el .env}"

# Lo que no necesita ningún contenedor de esta aplicación: escalar privilegios y las
# capacidades de root. Un fallo en una dependencia no alcanza para salir del contenedor.
x-endurecido: &endurecido
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-node: &node
  # Los servicios Node comparten techos, política de reinicio y endurecimiento; lo que los
  # distingue va en cada uno.
  <<: *endurecido
  restart: unless-stopped
  logging: *logging
  mem_limit: ${MEM_LIMIT_NODE:?falta MEM_LIMIT_NODE en el .env}
  # Techo de CPU, no reserva: la suma puede pasar los núcleos de la máquina. Sin esto, un
  # servicio en un bucle se queda con toda la CPU y los demás dejan de contestar.
  cpus: ${CPU_LIMIT_NODE:?falta CPU_LIMIT_NODE en el .env}
  # Ninguno escribe en su sistema de archivos: solo lee la imagen y responde.
  read_only: true
  tmpfs:
    - /tmp
  environment: &node-env
    LOG_LEVEL: ${LOG_LEVEL:?falta LOG_LEVEL en el .env}
    RATE_LIMIT_POR_MINUTO: ${RATE_LIMIT_POR_MINUTO:?falta RATE_LIMIT_POR_MINUTO en el .env}
    # El host y el puerto del broker no cambian entre ambientes: van literales.
    NATS_URL: nats://nats:4222

services:
  reverse-proxy:
    # Caddy sirve el frontend, enruta /api/<servicio>/ y emite y renueva el TLS (ADR-009).
    image: caddy:2-alpine
    <<: *endurecido
    # Caddy necesita atarse al 80 y al 443, que son privilegiados: es la única capacidad
    # que se le devuelve después de sacarle todas.
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_PROXY:?falta MEM_LIMIT_PROXY en el .env}
    cpus: ${CPU_LIMIT_PROXY:?falta CPU_LIMIT_PROXY en el .env}
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # `http://localhost` en desarrollo (sin TLS); el dominio a secas en producción, y
      # Caddy pide el certificado a Let's Encrypt solo.
      SITE_ADDRESS: ${SITE_ADDRESS:?falta SITE_ADDRESS en el .env}
    ports:
      # Todos los puertos del lado del host salen del .env: en una máquina donde ya corre
      # otra aplicación, dos proxies no pueden quedarse los dos con el 80 y el 443, y
      # mover a Templa tiene que ser cambiar el .env y nada más. Adentro del contenedor
      # Caddy sigue escuchando en 80 y 443 siempre.
      #
      # PROXY_ADDR es 0.0.0.0 cuando Templa es la única aplicación que atiende de afuera,
      # y 127.0.0.1 cuando otro proxy de la misma máquina le pasa el tráfico
      # (deployment/oracle-single/README.md).
      - "${PROXY_ADDR:?falta PROXY_ADDR en el .env}:${PUERTO_HTTP:?falta PUERTO_HTTP en el .env}:80"
      - "${PROXY_ADDR:?falta PROXY_ADDR en el .env}:${PUERTO_HTTPS:?falta PUERTO_HTTPS en el .env}:443"
      - "${PROXY_ADDR:?falta PROXY_ADDR en el .env}:${PUERTO_HTTPS:?falta PUERTO_HTTPS en el .env}:443/udp"
    volumes:
      - ./infrastructure/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      usuarios:
        condition: service_healthy
      cocinadas:
        condition: service_healthy
    healthcheck:
      # Contra el sitio interno de salud del Caddyfile, no contra la API de
      # administración: esa quedó apagada.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/salud"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    # La SPA React compilada, servida por su propio Caddy en modo file server (ADR-013).
    image: ${REGISTRO:?falta REGISTRO en el .env}/templa-frontend:${TAG:?falta TAG en el .env}
    build:
      context: ./microservices/frontend
    <<: *endurecido
    # El binario de Caddy trae NET_BIND_SERVICE como capacidad de archivo. Si no está en
    # el conjunto del contenedor, el exec falla con «operation not permitted» aunque el
    # puerto que use sea alto, como acá.
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_PROXY:?falta MEM_LIMIT_PROXY en el .env}
    cpus: ${CPU_LIMIT_PROXY:?falta CPU_LIMIT_PROXY en el .env}
    read_only: true
    # Este Caddy no guarda nada entre arranques (no emite certificados): sus directorios
    # de trabajo viven en memoria y desaparecen con el contenedor.
    tmpfs:
      - /tmp
      - /data
      - /config
    ports:
      - "${PUBLISH_ADDR:?falta PUBLISH_ADDR en el .env}:${PUERTO_FRONTEND:?falta PUERTO_FRONTEND en el .env}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  catalogo:
    # Recetas, ingredientes y utensilios. Solo lectura: los datos van dentro de la imagen,
    # tomados de las carpetas data/recetas/, data/ingredientes/ y data/utencillos/ del repositorio, así
    # que la versión del catálogo es la del commit desplegado (ADR-006).
    <<: *node
    image: ${REGISTRO:?falta REGISTRO en el .env}/templa-catalogo:${TAG:?falta TAG en el .env}
    build:
      # Contexto en la raíz porque la imagen empaqueta las carpetas de datos. Lo que entra
      # lo limita el .dockerignore de la raíz.
      context: .
      dockerfile: microservices/catalogo/Dockerfile
    environment:
      <<: *node-env
      PUERTO: "3001"
      DIRECTORIO_DATOS: /datos
    ports:
      - "${PUBLISH_ADDR:?falta PUBLISH_ADDR en el .env}:${PUERTO_CATALOGO:?falta PUERTO_CATALOGO en el .env}:3001"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  usuarios:
    # Registro, inicio de sesión y perfil. Emite los JWT que verifican los demás (ADR-012).
    <<: *node
    image: ${REGISTRO:?falta REGISTRO en el .env}/templa-usuarios:${TAG:?falta TAG en el .env}
    build:
      context: ./microservices/usuarios
    environment:
      <<: *node-env
      PUERTO: "3002"
      DATABASE_URL: postgres://${POSTGRES_USER:?falta POSTGRES_USER en el .env}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB en el .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env}
    ports:
      - "${PUBLISH_ADDR:?falta PUBLISH_ADDR en el .env}:${PUERTO_USUARIOS:?falta PUERTO_USUARIOS en el .env}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  cocinadas:
    # Tiempos registrados por paso en cada cocinada y el progreso por receta (ADR-005).
    <<: *node
    image: ${REGISTRO:?falta REGISTRO en el .env}/templa-cocinadas:${TAG:?falta TAG en el .env}
    build:
      context: ./microservices/cocinadas
    environment:
      <<: *node-env
      PUERTO: "3003"
      DATABASE_URL: postgres://${POSTGRES_USER:?falta POSTGRES_USER en el .env}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}@postgres:5432/${POSTGRES_DB:?falta POSTGRES_DB en el .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env}
    ports:
      - "${PUBLISH_ADDR:?falta PUBLISH_ADDR en el .env}:${PUERTO_COCINADAS:?falta PUERTO_COCINADAS en el .env}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    # Una sola instancia para usuarios y cocinadas, cada servicio con su propio esquema
    # (ADR-005). No publica puerto: se entra con `docker compose exec postgres psql`.
    image: postgres:17-alpine
    # Sin cap_drop: ALL como los demás. El arranque de postgres cambia dueño y permisos
    # del directorio de datos, y sin esas capacidades no levanta.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_POSTGRES:?falta MEM_LIMIT_POSTGRES en el .env}
    cpus: ${CPU_LIMIT_POSTGRES:?falta CPU_LIMIT_POSTGRES en el .env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en el .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en el .env}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    # Broker de eventos con JetStream para persistir los streams (ADR-003). El puerto de
    # monitoreo 8222 queda interno: se mira por túnel SSH si hace falta.
    image: nats:2-alpine
    <<: *endurecido
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MEM_LIMIT_NATS:?falta MEM_LIMIT_NATS en el .env}
    cpus: ${CPU_LIMIT_NATS:?falta CPU_LIMIT_NATS en el .env}
    read_only: true
    tmpfs:
      - /tmp
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-datos:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # Qué se pierde si se pierde cada uno (ver docs/DEPLOYMENT.md, sección Respaldo):
  postgres-datos: {}   # usuarios registrados y todas las cocinadas: es el que importa
  nats-datos: {}       # eventos pendientes de consumir; se regenera con el uso
  caddy-datos: {}      # certificados TLS; perderlo obliga a reemitir
  caddy-config: {}     # configuración derivada de Caddy; se regenera al arrancar
